<!doctype html>
<html lang="pt-BR" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistência Técnica & Importados | Produtos Originais e Reparo Especializado</title>
    <meta name="description" content="Venda de produtos importados 100% originais e assistência técnica especializada para celulares, MacBooks e computadores. Pronta entrega e garantia." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Assistência Técnica & Importados | Produtos Originais e Reparo Especializado" />
    <meta property="og:description" content="Smartphones, MacBooks, acessórios importados originais lacrados e assistência técnica com garantia de 90 dias." />
    <meta property="og:site_name" content="Assistência Técnica & Importados" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Assistência Técnica & Importados | Produtos Originais e Reparo Especializado" />
    <meta name="twitter:description" content="Os melhores produtos importados a pronta entrega e serviço técnico especializado para seus equipamentos." />
    
    <!-- Google Fonts: Space Grotesk + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Structured Data (JSON-LD) for LocalBusiness / ElectronicsRepair -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ElectronicsRepair",
      "name": "Assistência Técnica & Importados",
      "image": "/src/assets/images/hero_importados_assistencia_1793878627591.jpg",
      "telephone": "(00) 00000-0000",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "SEU ENDEREÇO AQUI",
        "addressCountry": "BR"
      },
      "priceRange": "$$",
      "currenciesAccepted": "BRL",
      "paymentAccepted": "Cartão de Crédito, PIX, Boleto, Dinheiro",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        "opens": "09:00",
        "closes": "19:00"
      }
    }
    </script>
  </head>
  <body class="bg-[#0b1120] text-slate-100 antialiased selection:bg-[#1E3A8A] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
